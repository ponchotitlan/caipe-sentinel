apiVersion: v1
kind: Namespace
metadata:
  name: poc-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-caipe-web
  namespace: poc-demo
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Hello World</title>
        <style>
          :root {
            --bg-a: #ffecd2;
            --bg-b: #fcb69f;
            --bg-c: #a1c4fd;
            --text: #102a43;
          }

          * {
            box-sizing: border-box;
          }

          body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Trebuchet MS", "Gill Sans", sans-serif;
            color: var(--text);
            background: linear-gradient(120deg, var(--bg-a), var(--bg-b), var(--bg-c));
            background-size: 200% 200%;
            animation: harmonicFlow 10s ease-in-out infinite;
          }

          .wrap {
            text-align: center;
            padding: 1.5rem;
          }

          .emoji {
            margin: 0;
            font-size: clamp(4rem, 14vw, 8rem);
            line-height: 1;
          }

          h1 {
            margin: 0.6rem 0 0;
            font-size: clamp(2rem, 8vw, 4rem);
            letter-spacing: 0.03em;
            text-transform: uppercase;
          }

          @keyframes harmonicFlow {
            0% {
              background-position: 0% 50%;
            }
            50% {
              background-position: 100% 50%;
            }
            100% {
              background-position: 0% 50%;
            }
          }
        </style>
      </head>
      <body>
        <main class="wrap">
          <p class="emoji" role="img" aria-label="robot">🤖</p>
          <h1>Hello World!</h1>
        </main>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-caipe
  namespace: poc-demo
  labels:
    app: hello-caipe
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: hello-caipe
  template:
    metadata:
      labels:
        app: hello-caipe
    spec:
      containers:
        - name: hello-caipe
          image: nginx:1.27-alpine
          command: ["nginx", "-g", "daemon off;"]
          args: []
          ports:
            - containerPort: 80
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: web-content
          configMap:
            name: hello-caipe-web
            items:
              - key: index.html
                path: index.html
---
apiVersion: v1
kind: Service
metadata:
  name: hello-caipe
  namespace: poc-demo
spec:
  type: NodePort
  selector:
    app: hello-caipe
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30081
