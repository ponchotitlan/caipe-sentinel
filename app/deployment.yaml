apiVersion: v1
kind: Namespace
metadata:
  name: poc-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-caipe
  namespace: poc-demo
  labels:
    app: hello-caipe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-caipe
  template:
    metadata:
      labels:
        app: hello-caipe
    spec:
      containers:
        - name: hello-caipe
          # Pin an explicit tag (never :latest) so `break-demo.sh` has a
          # known-good value to diff against and restore.
          image: nginxdemos/hello:plain-text
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hello-caipe
  namespace: poc-demo
spec:
  selector:
    app: hello-caipe
  ports:
    - port: 80
      targetPort: 80
