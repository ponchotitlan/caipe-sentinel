apiVersion: v1
kind: Namespace
metadata:
  name: poc-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-caipe-web
  namespace: poc-demo
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Pedro Pedro Pedro</title>
        <style>
          :root {
            --bg-a: #ffecd2;
            --bg-b: #fcb69f;
            --bg-c: #a1c4fd;
            --text: #102a43;
            --shadow: rgba(16, 42, 67, 0.25);
          }

          * {
            box-sizing: border-box;
          }

          body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            font-family: "Trebuchet MS", "Gill Sans", sans-serif;
            color: var(--text);
            background: linear-gradient(120deg, var(--bg-a), var(--bg-b), var(--bg-c));
            background-size: 200% 200%;
            animation: harmonicFlow 10s ease-in-out infinite;
          }

          .wrap {
            text-align: center;
            padding: 1.5rem;
          }

          .gif {
            width: min(88vw, 380px);
            border-radius: 18px;
            box-shadow: 0 14px 36px var(--shadow);
          }

          h1 {
            margin: 1rem 0 0;
            font-size: clamp(1.8rem, 6vw, 3.2rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: 0 4px 10px rgba(255, 255, 255, 0.5);
          }

          @keyframes harmonicFlow {
            0% {
              background-position: 0% 50%;
            }
            50% {
              background-position: 100% 50%;
            }
            100% {
              background-position: 0% 50%;
            }
          }
        </style>
      </head>
      <body>
        <main class="wrap">
          <img
            class="gif"
            src="/pedro-raccoon-raccoon.gif"
            alt="Pedro Pedro Pedro raccoon dance"
          />
          <h1>Pedro Pedro Pedro!</h1>
        </main>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-caipe
  namespace: poc-demo
  labels:
    app: hello-caipe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-caipe
  template:
    metadata:
      labels:
        app: hello-caipe
    spec:
      initContainers:
        - name: build-pedro-gif
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              curl -fsSL -o /work/pedro-raccoon-raccoon.gif \
                https://raw.githubusercontent.com/ponchotitlan/caipe-sentinel/main/img/pedro-raccoon-raccoon.gif
              test -s /work/pedro-raccoon-raccoon.gif
              chmod 0644 /work/pedro-raccoon-raccoon.gif
          volumeMounts:
            - name: pedro-static
              mountPath: /work
      containers:
        - name: hello-caipe
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: pedro-static
              mountPath: /usr/share/nginx/html/pedro-raccoon-raccoon.gif
              subPath: pedro-raccoon-raccoon.gif
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: web-content
          configMap:
            name: hello-caipe-web
            items:
              - key: index.html
                path: index.html
        - name: pedro-static
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hello-caipe
  namespace: poc-demo
spec:
  type: NodePort
  selector:
    app: hello-caipe
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30081
