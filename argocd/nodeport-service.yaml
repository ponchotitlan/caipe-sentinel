apiVersion: v1
kind: Service
metadata:
  name: argocd-server-nodeport
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    # Plain HTTP (server.insecure=true was set via argocd-cmd-params-cm) so
    # the cloudflared container's origin request needs no TLS verification.
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
